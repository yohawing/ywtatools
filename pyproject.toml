[project]
name = "ywtatools"
version = "0.1.0"
description = "Maya/Blender用テクニカルアーティストツール集"
requires-python = ">=3.10"

[tool.ruff]
line-length = 128
indent-width = 4
target-version = "py310"
fix = true
exclude = [
    "maya/cpp",
    "build",
    "build.*",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# 既存コードへの diff 爆発を防ぐため、まずはエラー中心の最小構成に絞る。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
